apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-downward-api-python-demo
  labels:
    app: eks-downward-api-python-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eks-downward-api-python-demo
  template:
    metadata:
      labels:
        app: eks-downward-api-python-demo
    spec:
      serviceAccountName: default
      containers:
        - name: app
          # Replace this with your ECR image URI after pushing:
          # Example:
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks-downward-api-python-demo:latest
          image: REPLACE_WITH_YOUR_ECR_IMAGE_URI
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            # Optional examples:
            # Uncomment only after creating matching ConfigMap/Secret.
            #
            # - name: APP_CONFIG
            #   valueFrom:
            #     configMapKeyRef:
            #       name: app-config
            #       key: APP_CONFIG
            #
            # - name: DB_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: app-secret
            #       key: DB_PASSWORD
